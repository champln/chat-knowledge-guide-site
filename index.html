    const $=s=>document.querySelector(s); const $$=s=>[...document.querySelectorAll(s)];
    function esc(s=''){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

    function markdown(md){const lines=md.replace(/\r/g,'').split('\n');let out='',list=null,para=[];const flush=()=>{if(para.length){out+=`<p>${inline(para.join(' '))}</p>`;para=[]}if(list){out+=`</${list}>`;list=null}};for(const [i,raw] of lines.entries()){const line=raw.trim();if(!line){flush();continue}let m;if((m=line.match(/^(#{1,3})\s+(.+)/))){flush();const n=m[1].length;out+=`<h${n} id="topic-${i}" tabindex="-1">${inline(m[2])}</h${n}>`;continue}if(/^---+$/.test(line)){flush();out+='<hr>';continue}if((m=line.match(/^[-*]\s+(.+)/))){if(list!=='ul'){flush();list='ul';out+='<ul>'}out+=`<li>${inline(m[1])}</li>`;continue}if((m=line.match(/^\d+\.\s+(.+)/))){if(list!=='ol'){flush();list='ol';out+='<ol>'}out+=`<li>${inline(m[1])}</li>`;continue}if((m=line.match(/^>\s?(.*)/))){flush();out+=`<blockquote>${inline(m[1])}</blockquote>`;continue}para.push(line)}flush();return out}
    function linksFrom(md,source){const found=[],seen=new Set();const re=/\[([^\]]+)\]\((https?:\/\/[^)]+)\)|(?<!\()https?:\/\/[^\s)]+/g;let m;while((m=re.exec(md))){const url=(m[2]||m[0]).replace(/[.,]$/,'');if(seen.has(url))continue;seen.add(url);found.push({title:m[1]||new URL(url).hostname,url,source,type:linkType(url)})}return found}

    const embeddedDocs={"boom-big-nose-summary-and-links.md":"# สรุปแชทและลิงก์จาก Boom Big Nose\n\nช่วงข้อความที่ตรวจ: 27 สิงหาคม 2026 – 12 ตุลาคม 2026 · ตรวจล่าสุด 15 ตุลาคม 2026\n\n## อัปเดตใหม่ 9–12 ตุลาคม 2026\n\n- **9 ต.ค. — Songmai:** ชุด Skill ส่งต่องานระหว่างแชท / AI โดยแนบหลักฐานไฟล์และ Git ให้ผู้รับตรวจว่าข้อมูลเปลี่ยนจากสรุปเดิมหรือไม่ เช่น branch, งานค้าง และผลทดสอบเก่าที่ยังใช้ได้หรือไม่ ยืนยันหัวข้อจากหน้าบทความสาธารณะแล้ว GitHub อยู่ในความคิดเห็นที่ต้องเป็นสมาชิกจึงยังไม่ได้อ่าน\n- **11–12 ต.ค.:** มีลิงก์ Kruoop ใหม่อีก 3 URL โดยหนึ่งรายการส่งซ้ำวันที่ 11 ต.ค. 11:26 และ 20:41 จึงรวมครั้งเดียว หน้าอ่านสาธารณะของสามรายการยังไม่เปิดเผยหัวข้อ จึงใส่ชื่ออ้างอิงตามวันส่งไว้ ไม่เดาชื่อบทเรียน\n- **12 ต.ค. 23:41:** โปรโมชั่น BoomBigNose+ ผ่าน Skool เนื้อหาที่กล่าวถึงคือ n8n, AI Chat Agent, รูป/วิดีโออัตโนมัติ, วิเคราะห์การลงทุน และเชื่อมเว็บ ระบุ Early Bird $15 สำหรับ 555 คนแรก เป็นข้อความขาย ยังไม่ยืนยันว่าราคานี้ใช้ได้ปัจจุบันหรือมีที่เหลือ และไม่รับรองรายได้ตามโฆษณา\n- งานที่ควรทำ: เริ่มจาก Songmai หากมีปัญหาส่งต่องาน AI; ขอหัวข้อของลิงก์ที่อ่านไม่ได้ก่อนเลือกเรียน ไม่พบงานที่มอบหมายหรือกำหนดส่งใหม่\n- ฉบับร่าง: “ขอชื่อบทเรียนในลิงก์วันที่ 11–12 ต.ค. และ GitHub ของ Songmai ครับ ส่วน Early Bird ปัจจุบันยังใช้ได้หรือไม่ มีเงื่อนไขอะไรบ้าง?” ยังไม่ได้ส่ง\n\n### ลิงก์ใหม่พร้อมหัวข้อ\n\n- [Songmai: Skill ส่งต่องาน AI พร้อมตรวจความเปลี่ยนแปลง — 9 ต.ค.](https://kruoop.com/s/post/5efea5b3-38fa-42b1-a740-5d52d9570c79)\n- [เนื้อหา Kruoop ส่ง 11 ต.ค. เวลา 07:45 — ยังอ่านชื่อบทเรียนไม่ได้](https://kruoop.com/s/post/144916cd-a5dd-4b81-b3a2-30481eb23cc4)\n- [เนื้อหา Kruoop ส่ง 11 ต.ค. เวลา 11:26 และ 20:41 — ยังอ่านชื่อบทเรียนไม่ได้](https://kruoop.com/s/post/1f6bd7bf-6b37-49fb-a5e0-439952111cb7)\n- [เนื้อหา Kruoop ส่ง 12 ต.ค. เวลา 11:25 — ยังอ่านชื่อบทเรียนไม่ได้](https://kruoop.com/s/post/4f6c8ae3-d34d-40f8-b644-eed7f43cadb0)\n- [BoomBigNose+ บน Skool — รายละเอียดคอร์สและโปรโมชั่นจากแชท](https://www.skool.com/boombignose-8034/about?ref=9e0b893895d24f05aea9cddf58ee8e89)\n\n## อัปเดตใหม่ 2–5 ตุลาคม 2026\n\nเปิดหน้าเนื้อหาสาธารณะบน Kruoop เพื่อยืนยันหัวข้อทั้งสองรายการแล้ว แต่ไม่ได้อ่าน PDF ทั้งเล่มหรือความคิดเห็นที่ต้องเป็นสมาชิก\n\n- **2 ต.ค. — kicad-thai:** ชุด Skill สำหรับ KiCad + AI ช่วยตรวจ ERC/DRC และเตรียม Gerber / BOM / CPL มีแนวทางตัวหนังสือไทย แหล่งผลิตและอะไหล่ และเช็กลิสต์ข้อกำหนดไทยตามบทความ ต้องมี KiCad กับ Python การลากลายยังทำในโปรแกรม ก่อนสั่งผลิตต้องตรวจไฟล์และข้อกำหนดจริงอีกครั้ง\n- **5 ต.ค. — คุมทีม AI “บอท 20 ตัว คนเดียวคุม”:** คู่มือภาษาไทย 16 หน้าจากกรณี Grok Bot ครอบคลุมแบ่งหน้าที่ 5 หลักการ เครื่องมือ pstack ระบบตรวจอัตโนมัติ และให้คนตรวจงานเสี่ยง มีแนวทางเริ่มต้น 7 ขั้น\n- งานที่ควรทำ: เลือกคู่มือที่ตรงกับงาน ทดลองกับตัวอย่างเล็กและตรวจผลก่อนใช้จริง ไม่พบงานที่มอบหมายหรือกำหนดส่งใหม่\n- ฉบับร่างหากต้องการ repo: “ขอลิงก์ GitHub ของ kicad-thai และตัวอย่างตั้งค่า pstack ครับ” ยังไม่ได้ส่ง\n\n### ลิงก์ใหม่พร้อมหัวข้อ\n\n- [Skill ช่วยตรวจ PCB และเตรียมไฟล์ส่งโรงงานด้วย KiCad + AI — ส่ง 2 ต.ค.](https://kruoop.com/s/post/a24dcfa0-ed3e-442b-b802-262a271f2b2f)\n- [คู่มือคุมทีม AI “บอท 20 ตัว คนเดียวคุม” — ส่ง 5 ต.ค.](https://kruoop.com/s/post/069552da-ec6a-4084-bf5d-ef0005da3bdd)\n- [ไฟล์ Kruoop-GrokBot-ebook.pdf — คู่มือคุมทีม AI](https://kruoop.com/api/media/2df05b90-5e46-444d-92b1-8c214c5caca0)\n\nลิงก์ GitHub ของ kicad-thai อยู่ในความคิดเห็นที่หน้านี้จำกัดสมาชิก จึงยังไม่ได้ดึง URL มา\n\n## สรุปเนื้อหา\n\nแชทนี้เป็นการส่งลิงก์เนื้อหาหลังจากคุณแสดงความคิดเห็นบนเพจเป็นหลัก รอบใหม่เพิ่มหน้าคอมมูนิตี้ BoomBigNose และวิดีโอเรื่อง Jev ที่ใช้คู่ Hermes + VPS\n\nหัวข้อหลักของเนื้อหา:\n\n- **Claude Design และการสร้างเว็บไซต์** — ใช้ MCP ช่วยให้ Claude สร้างเว็บไซต์ที่มีงานออกแบบดีขึ้น\n- **AI Agent และโลก 3D** — สร้างทีม AI ให้มีตัวตนในโลก 3D ด้วย Hermes3D และรันบน VPS ตลอด 24 ชั่วโมง\n- **โฆษณาด้วย Claude** — สร้างสื่อโฆษณาทั้งภาพและวิดีโอ\n- **สร้างและ Deploy แอป** — ใช้ ChatGPT Work สร้างแอปและนำขึ้นใช้งานจริง\n- **Claude Code ตั้งแต่พื้นฐานถึงขั้นสูง** — สร้างเว็บ ตั้งระบบ AI อัตโนมัติ Deploy งาน และใช้ Ponytail ช่วยคิดแบบ Senior Developer\n- **เว็บไซต์ 3D** — ใช้ ChatGPT 6 Astra ร่วมกับ Blender ทำ Motion และ Deploy เว็บไซต์ 3D\n- **ไฟล์ประกอบ BIGNOSE-OS-GitHub** — รวมเนื้อหาหรือไฟล์สำหรับทำตามบทเรียน\n- **AI Automation Community** — คอมมูนิตี้รวม n8n, Claude, Hermes, OpenClaw, AI Chat Agent และ Workflow สำเร็จรูป\n- **Jev + Hermes + VPS** — อธิบาย Jev ในฐานะ AI สำหรับช่วยตัดสินใจแบบ TypeSafe และแนวทางใช้งานร่วมกับ Hermes บน VPS\n\n## งานที่ควรทำ\n\n- เริ่มจากวิดีโอ **Claude Code 101** หากยังไม่คุ้นกับ Claude Code\n- เปิดโฟลเดอร์ **BIGNOSE-OS-GitHub** เพื่อตรวจไฟล์ประกอบก่อนทำตามบทเรียน\n- หากเน้นงานเว็บไซต์ ให้ดู Claude Design → Claude Code 101 → Claude Code + Ponytail\n- หากเน้นงานสร้างสรรค์ ให้ดูโฆษณาด้วย Claude หรือ GPT-6 Astra + Blender\n- หากต้องการระบบ Agent ระยะยาว ให้ดู Hermes3D บน VPS\n- หากสนใจ Automation ต่อเนื่อง ให้ดูวิดีโอ Jev ก่อน แล้วค่อยเปรียบเทียบคอมมูนิตี้บน Kruoop หรือ Skool\n\nไม่พบงานที่ Boom Big Nose มอบหมายโดยตรง และไม่พบกำหนดเวลาหรือกำหนดส่ง\n\n## ลิงก์ตรงพร้อมหัวข้อ\n\n1. [BIGNOSE-OS-GitHub — โฟลเดอร์เนื้อหาและไฟล์ประกอบ](https://drive.google.com/drive/folders/1U7jI8sdgLCcUdbSqQbeTNzPH8vyscven?usp=sharing)\n2. [สอน Claude Design สร้างเว็บไซต์แบบใหม่ด้วย MCP](https://youtu.be/T14P_8mtiiY)\n3. [สร้างทีม AI ในโลก 3D ด้วย Hermes3D บน VPS 24/7](https://youtu.be/tx0vvZvGlIg)\n4. [ให้ Claude ช่วยสร้างโฆษณาทั้งภาพและวิดีโอ](https://youtu.be/g-9rtPHPcag)\n5. [สร้างแอปด้วย ChatGPT Work พร้อม Deploy ใช้งานจริง](https://youtu.be/HRfZFvrAKOE)\n6. [Claude Code 101: สร้างเว็บ ตั้ง AI อัตโนมัติ และ Deploy](https://youtu.be/QCtrBNLSJxQ)\n7. [ใช้ Claude Code ร่วมกับ Ponytail ให้คิดแบบ Senior Developer](https://youtu.be/Lal_Gogg1fg?si=Oqa2j2RxqtxOvCNf)\n8. [ChatGPT 6 Astra + Blender: สร้างเว็บ 3D ตั้งแต่ Motion ถึง Deploy](https://youtu.be/eqkF5GRnw70)\n9. [เพจ Boom Big Nose](https://www.facebook.com/107584895051071/)\n10. [BoomBigNose Community บน Kruoop](https://kruoop.com/about?c=boombignose)\n11. [Jev คืออะไร? AI สำหรับตัดสินใจแบบ TypeSafe ใช้คู่ Hermes + VPS](https://youtu.be/vc0_v-81EYw)\n12. [BoomBigNose+ — คอมมูนิตี้ AI Automation, n8n, Claude และ Hermes](https://www.skool.com/boombignose/about)\n\n## ลิงก์โพสต์/คอมเมนต์ต้นทาง\n\n1. [ต้นทางวิดีโอ Claude Design และ MCP](https://facebook.com/100080133357370/posts/1098661752814926/?comment_id=894851146753100)\n2. [ต้นทางวิดีโอ Hermes3D และทีม AI บน VPS](https://facebook.com/100080133357370/posts/1102947612386340/?comment_id=2156309098316326)\n3. [ต้นทางวิดีโอสร้างโฆษณาด้วย Claude](https://facebook.com/100080133357370/posts/1103655488982219/?comment_id=1096165476177847)\n4. [ต้นทางวิดีโอสร้างแอปด้วย ChatGPT Work](https://facebook.com/100080133357370/posts/1107237721957329/?comment_id=1650660963155157)\n5. [ต้นทางวิดีโอ Claude Code 101](https://facebook.com/100080133357370/posts/1110173568330411/?comment_id=1044656145115996)\n6. [ต้นทางวิดีโอ Claude Code + Ponytail](https://facebook.com/100080133357370/posts/1109342291746872/?comment_id=1054621557445006)\n7. [ต้นทางวิดีโอ ChatGPT 6 Astra + Blender](https://facebook.com/100080133357370/posts/1112801791400922/?comment_id=1039290868929471)\n8. [ต้นทางข้อความแนะนำ BoomBigNose Community บน Kruoop](https://facebook.com/100080133357370/posts/1116866100994491/?comment_id=2023896168287848)\n9. [ต้นทางข้อความซ้ำของ BoomBigNose Community บน Kruoop](https://facebook.com/100080133357370/posts/1118627230818378/?comment_id=1819516419041805)\n10. [ต้นทางวิดีโอ Jev และลิงก์คอมมูนิตี้ Skool](https://facebook.com/100080133357370/posts/1120349260646175/?comment_id=2276885669754984)\n\n## ข้อความตอบกลับที่แนะนำ\n\nข้อความทั้งหมดเป็นการส่งเนื้อหาอัตโนมัติ จึงไม่จำเป็นต้องตอบ หากต้องการขอคำแนะนำเรื่องลำดับการเรียน สามารถใช้ข้อความนี้:\n\n> ขอบคุณครับ ผมได้รับลิงก์เนื้อหาครบแล้ว สนใจนำ Claude Code และ AI Agent มาประยุกต์ใช้กับงาน รบกวนแนะนำลำดับคลิปหรือบทเรียนที่ควรเริ่มก่อนให้หน่อยครับ\n","eep-academy-links.md":"# ลิงก์จากแชท EEP Academy\n\nช่วงข้อความที่ตรวจ: 12 สิงหาคม 2026 – 15 ตุลาคม 2026 · ตรวจล่าสุด 15 ตุลาคม 2026 เวลา 21:17 ตามข้อความล่าสุดที่อ่าน\n\n## อัปเดตใหม่ 6–15 ตุลาคม 2026\n\n### ประเด็นสำคัญ\n\n- **Agent ทำงานแทน:** 5 use case ของ Dots ได้แก่ค้นคว้า เฝ้าข้อมูล ทำคอนเทนต์ ตามงาน และจัดการโปรเจกต์; มีตัวอย่าง ChatGPT รวมงานจากเมล แชท Drive และ Trello เป็นเว็บเดียว\n- **Skills / Workspace:** Gemini Skills สร้างด้วยการถามตอบ เขียนเอง หรืออัปโหลด; “Write Like Me” ใช้อีเมลที่เคยส่งเป็นตัวอย่างสไตล์; คลิป Claude for Google Workspace\n- **Coding:** แนวทางสั่ง Opus แบบบอกเป้าหมาย ข้อจำกัด เกณฑ์งานเสร็จ กฎงานเสี่ยง และหลักฐานตรวจงาน; อัปเดต Claude Code เรื่อง Loop, Sub-agent, Auto-retry และสลับโปรเจกต์; DeepSeek Harness\n- **แอปและภาพ:** Android ด้วย Stitch + Antigravity, ทดสอบด้วย emulator / Journeys; Nano Banana 2.1 สำหรับแก้เฉพาะจุดและทำภาพสินค้า\n- **วิดีโอ / งานสร้างสรรค์:** HeyGen แปลหลายภาษาโดยทดสอบหนึ่งภาษาก่อน มี Brand Glossary; ClaudeAnimationBase สร้างคลิปจากเว็บ; Artcraft ชุดเครื่องมือกราฟิก; AI Edge Foresight สำหรับประชุมแบบออฟไลน์ตามข้อความผู้ส่ง\n- **การตลาดและธุรกิจ:** Slop Monster ปรับภาษา, หาลูกค้าด้วย Skill + Apify/Firecrawl, Grokbot อ่าน X, CEO Agent, Perplexity Computer / Automations และ SEO ผ่าน Research Agent → Content Agent → Netlify\n- **ลดต้นทุน / ความปลอดภัย:** Jev คัดกรองก่อนโมเดลใหญ่, Fusion Claw แยกงานคิดจากซอฟต์แวร์งานซ้ำ, เคส Sophos และบทวิเคราะห์ Muse Wonder\n\n### งานที่ควรทำ กำหนดเวลา และข้อความที่ควรตอบ\n\n- เลือกทดลอง workflow เดียว วัดคุณภาพ ต้นทุน และการตรวจโดยคนก่อนใช้จริง การส่งอีเมล เผยแพร่เว็บ เก็บรายชื่อลูกค้า หรือต่อบริการรับเงินต้องพิจารณาสิทธิ์และข้อมูลแยกต่างหาก ไม่ได้ดำเนินการในรอบนี้\n- ข้อความ 6 ต.ค. **กล่าวอ้างวันที่ 11 ธ.ค. 2026** ว่า Custom GPTs จะเปลี่ยนเป็น plugins พร้อมเสนอให้สำรอง Instructions / Knowledge และทำบัญชีลิงก์กับ Actions เรื่องนี้ยังไม่ได้ตรวจประกาศทางการ จึงบันทึกเป็นประเด็นต้องยืนยัน ไม่ใช่กำหนดการที่คู่มือนี้รับรอง\n- ไม่พบงานที่เพจมอบหมายให้คุณส่งหรือวันที่นัดส่งงานใหม่ ตัวเลขโควตา ราคา รายได้ ความเร็ว และความสามารถทั้งหมดเป็นข้อมูลในข้อความที่แชร์ ไม่ใช่ผลทดสอบของคู่มือนี้\n- ฉบับร่าง: “ขอลิงก์ตรงบทเรียน Grokbot SEO และ Workspace cebook.com/153651195305155/\n","fullfunnel-summary-and-links.md":"# หัวหน้าแบงค์ FullFunnel\n\nตรวจล่าสุด 15 ตุลาคม 2026 · ประวัติที่ปรากฏ: 21 มิถุนายน–13 ตุลาคม 2026\n\n## อัปเดตใหม่ 13 ตุลาคม 2026\n\nเวลา 21:56 เพจส่งคำเชิญรับ “เนื้อหาบทเรียน Claude ช่วยทำงานแทน ฉบับจับมือทำ” หลังการแสดงความคิดเห็น เป็นข้อความให้กด “ขอวิธี cowork” เช่นเดิม ยังไม่เห็น URL บทเรียนตรง ราคา หรือกำหนดเวลาใหม่ และไม่ได้กดปุ่มส่งคำขอ\n\n- [บทเรียน Claude ช่วยทำงานแทน ฉบับจับมือทำ — โพสต์ต้นทาง 13 ต.ค.](https://facebook.com/100083369377340/posts/1109735161815453/?comment_id=1791110728636207)\n- งานที่ควรทำ: หากต้องการเรียนต่อ ขอ URL ตรงและเงื่อนไขการเข้าถึงก่อน\n- ฉบับร่าง: “ขอลิงก์ตรงบทเรียน Claude ช่วยทำงานแทนฉบับล่าสุด พร้อมรายละเอียดค่าใช้จ่ายและสิ่งที่ต้องเตรียมครับ” ยังไม่ได้ส่ง\n\n## ประวัติเดิมถึง 21 กันยายน\n\n## สรุปประเด็นสำคัญ\n\nแชทนี้ส่วนใหญ่เป็นข้อความอัตโนมัติจากเพจ หลังคุณแสดงความคิดเห็นบนโพสต์เรื่องบทเรียน Claude Cowork ไม่ใช่การสนทนาสรุปงานกับบุคคล\n\n- เพจส่งคำแนะนำให้กด “ขอวิธี cowork” เพื่อรับบทเรียน AI Claude Cowork ฉบับจับมือทำหลายครั้ง ระหว่าง มิ.ย.–ก.ย.\n- วันที่ 14 ส.ค. คุณเคยส่ง “ขอวิธี cowork” แล้วเพจตอบให้กด “เริ่มเรียน” เพื่อรับสิทธิ์เรียน\n- มีข้อความโปรโมชั่นพร้อมปุ่ม “รับข้อเสนอ” วันที่ 3, 13 และ 21 ก.ย. แต่ยังไม่เห็นรายละเอียดข้อเสนอหรือราคาที่ตกลง\n- ในข้อความที่อ่านไม่มี URL บทเรียนตรง มีเพียงปุ่มและลิงก์โพสต์/คอมเมนต์ต้นทาง\n\n## งานที่ควรทำและกำหนดเวลา\n\n- หากต้องการเรียนต่อ ผู้ใช้สามารถเปิดแชทและกดปุ่ม “เริ่มเรียน” เอง หรือขอ URL บทเรียนตรงจากเพจ\n- ก่อนรับข้อเสนอให้ตรวจเนื้อหา ราคา และเงื่อนไข ไม่มีข้อมูลพอให้สรุปว่ามีการสมัครหรือชำระเงินแล้ว\n- ไม่พบงานที่ได้รับมอบหมาย กำหนดส่งงาน หรือวันหมดอายุข้อเสนอในข้อความที่อ่าน\n\n## ข้อความที่ควรตอบ — ฉบับร่าง\n\n“ขอลิงก์บทเรียน Claude Cowork ฉบับจับมือทำที่เปิดอ่านได้โดยตรง พร้อมรายละเอียดว่าฟรีหรือมีค่าใช้จ่าย และเงื่อนไขการเรียนครับ”\n\nยังไม่ได้ส่งข้อความ ไม่ได้กดปุ่มขอบทเรียน เริ่มเรียน หรือรับข้อเสนอ และไม่ได้แก้ไขข้อมูลใน Messenger\n\n## ลิงก์พร้อมหัวข้อ\n\nลิงก์ด้านล่างเป็นโพสต์และคอมเมนต์ที่กระตุ้นข้อความบทเรียน ไม่ใช่ลิงก์ตัวบทเรียน ยังคงแยกตามวันที่เพื่อย้อนกลับไปหาต้นทางได้\n\n- [ต้นทางคำขอบทเรียน Claude Cowork — 21 มิ.ย.](https://facebook.com/100083369377340/posts/1010472081741762/?comment_id=2246745252727515)\n- [ต้นทางคำขอบทเรียน Claude Cowork — 22 ก.ค.](https://facebook.com/100083369377340/posts/1036807702441533/?comment_id=27514993904818330)\n- [ต้นทางคำขอบทเรียน Claude Cowork — 2 ส.ค.](https://facebook.com/100083369377340/posts/1044397355015901/?comment_id=1019582030885260)\n- [ต้นทางคำขอบทเรียน Claude Cowork — 14 ส.ค.](https://facebook.com/100083369377340/posts/1057109907077979/?comment_id=1927464944589219)\n- [ต้นทางคำขอบทเรียน Claude Cowork — 1 ก.ย.](https://facebook.com/100083369377340/posts/1073137365475233/?comment_id=2114460182780016)\n- [ต้นทางคำขอบทเรียน Claude Cowork — 11 ก.ย.](https://facebook.com/100083369377340/posts/1081124374676532/?comment_id=1786384162785013)\n- [ต้นทางคำขอบทเรียน Claude Cowork — 15 ก.ย.](https://facebook.com/100083369377340/posts/1084635704325399/?comment_id=2837968636558576)\n- [ต้นทางคำขอบทเรียน Claude Cowork — 19 ก.ย.](https://facebook.com/100083369377340/posts/1088923427229960/?comment_id=1343490575510938)\n","kem-life-summary-and-links.md":"# สรุปแชท Kem Life\n\nช่วงข้อความที่อ่าน: **13 สิงหาคม 2026 – 12 ตุลาคม 2026** · ตรวจล่าสุด 15 ตุลาคม 2026\n\n## อัปเดตใหม่ 8–12 ตุลาคม 2026\n\n- **8 ต.ค.:** ส่งลิสต์ 274 หมวดคอนเทนต์สำหรับ Facebook Monetization ตามการรวบรวมของผู้ส่ง ยังไม่ได้ตรวจเนื้อหาใน Notion หรือรับรองจำนวนหมวดจาก Facebook\n- **10 และ 12 ต.ค.:** ส่งเอกสาร “8 Prompt ใช้ Claude สร้างช่อง YouTube ตั้งแต่ศูนย์ ไปถึงเกณฑ์สร้างรายได้ใน 90 วัน” เป็น URL เดียวกันจึงรวมครั้งเดียว “90 วัน” เป็นชื่อ/เป้าหมายของเอกสาร ไม่ใช่การรับประกันผลหรือกำหนดส่งงานของคุณ\n- โปรโมชั่น 1010 ถูกส่งพร้อมคำว่า “วันนี้วันสุดท้าย” ทั้งวันที่ 10 และ 12 ต.ค. จึงไม่ควรอนุมานว่ายังใช้ได้วันที่ 15 ต.ค. ต้องถามเงื่อนไขปัจจุบันก่อนซื้อ ไม่มีการซื้อหรือสมัครในรอบนี้\n- งานที่ควรทำ: เลือก niche และทดลอง Prompt กับตัวอย่างช่องก่อนวางแผนผลิตจริง ไม่พบงานที่มอบหมายหรือวันส่งงานใหม่\n- ฉบับร่าง: “ขอลิงก์เอกสาร 8 Prompt ฉบับล่าสุด และยืนยันว่าโปร 1010 ยังใช้ได้หรือไม่ พร้อมราคาและเงื่อนไขปัจจุบันครับ” ยังไม่ได้ส่ง\n\n### ลิงก์ใหม่พร้อมหัวข้อ\n\n- [274 Niche สำหรับ Facebook Monetization — ส่ง 8 ต.ค.](https://app.notion.com/p/cryptodog/274-Niche-Facebook-FB-Monetization-3f30157f27d78116a7ddfa90b775d0a7?source=copy_link)\n- [8 Prompt Claude สำหรับสร้างช่อง YouTube — ส่ง 10 และ 12 ต.ค.](https://app.notion.com/p/cryptodog/8-Prompt-Claude-YouTube-90-3f50157f27d781b8b574d92d534e76f8?source=copy_link)\n\n## อัปเดตใหม่ 29 กันยายน–4 ตุลาคม 2026\n\nพบคู่มือ “Prompt AI แบบแนวเกาหลีตั้งแต่ศูนย์” ส่งวันที่ 29 ก.ย. และส่งซ้ำวันที่ 4 ต.ค. เป็น URL เดียวกัน จึงรวมลิงก์เพียงครั้งเดียว ยังไม่ได้อ่านเนื้อหาภายใน Notion\n\n- [คู่มือ Prompt AI แนวเกาหลี ตั้งแต่ศูนย์ — Kem Life](https://app.notion.com/p/cryptodog/Prompt-Prompt-AI-3e90157f27d78178a837d21c5f9184e4?source=copy_link)\n- งานที่ควรทำ: เปิดคู่มือและเลือกตัวอย่าง Prompt มาทดลองกับงานของตัวเอง\n- ไม่พบวันส่งงานหรือข้อความใหม่ของวันที่ 5 ต.ค. ในช่วงที่ตรวจ\n- ฉบับร่างหากเปิดเอกสารไม่ได้: “ขอลิงก์คู่มือ Prompt AI แนวเกาหลีที่เปิดอ่านได้ครับ” ยังไม่ได้ส่ง\n\n## สรุปภาพรวม\n\n- ข้อความส่วนใหญ่เป็นระบบตอบกลับหลังคุณแสดงความคิดเห็นบนโพสต์ของ Kem Life แล้วส่งคู่มือหรือ Prompt เพิ่มเติมให้ทาง Messenger\n- หัวข้อหลักคือการใช้ AI สร้างวิดีโอและหารายได้ เช่น คลิปขายสินค้าแบบตัวละครพูดได้, ใช้ Gemini ช่วยเขียนสคริปต์และตัดต่อ, เริ่มหาเงินด้วย AI จากศูนย์, ทำเพจแบบไม่ออกหน้า และ YouTube Automation\n- มีการโปรโมตคอร์ส **Claude + Video = Money / AI Video Mastery** ซ้ำหลายครั้ง พร้อมข้อความให้รีบสมัครก่อนขึ้นราคา\n- คู่มือบางรายการต้องแอด LINE แล้วพิมพ์คีย์เวิร์ดเพื่อรับเนื้อหา ได้แก่ **“faceless”** และ **“ลิง”**\n- ข้อความเรื่อง **“ไม่ต้องมีประสบการณ์ ก็เริ่มหาเงินด้วย AI ได้ — 5 วิธี”** และลิงก์คอร์สถูกส่งซ้ำ จึงรวมเป็นรายการเดียวด้านล่าง\n- วันที่ 26 ก.ย. มีการส่งชุด **Talking Character ขายสินค้า** ซ้ำ โดยเปลี่ยนคีย์เวิร์ดรับคู่มือใน LINE เป็น `ขายของ`; ลิงก์ YouTube และหน้าคอร์สเป็นรายการเดิม จึงไม่เพิ่มลิงก์ซ้ำ\n- คำกล่าวเรื่องรายได้ เช่น “วันละ 1,000” หรือ “$115,000/เดือน” เป็นชื่อ/คำโปรยของคอนเทนต์ ไม่ใช่การรับประกันผลลัพธ์\n\n## ประเด็นสำคัญตามลำดับเวลา\n\n1. **13 ส.ค. 2026 — Talking Character ขายสินค้า**  \n   ส่งคู่มือทำสิ่งของพูดได้แบบ Step by Step, วิดีโอ YouTube และลิงก์คอร์ส พร้อมโค้ด `NOTION` ลด 10%\n\n2. **15 ส.ค. 2026 — GOODBYE CAPCUT**  \n   แจก 7 Prompt ให้ Gemini ช่วยเขียนสคริปต์และตัดต่อวิดีโอครบทั้งคลิป\n\n3. **4 ก.ย. 2026 — เริ่มหาเงินด้วย AI จากศูนย์**  \n   แจก 7 ขั้นตอนพร้อม Prompt และวิดีโอ “วิธีหาเงินวันละ 1,000 จาก AI”\n\n4. **9 และ 13 ก.ย. 2026 — มือใหม่หาเงินด้วย AI**  \n   แจก 5 วิธีสำหรับผู้ไม่มีประสบการณ์ พร้อมโปรโมตคอร์ส ข้อความชุดนี้ถูกส่งซ้ำสองครั้ง\n\n5. **12 ก.ย. 2026 เวลา 16:57 — Faceless Instagram**  \n   เสนอคู่มือสร้างเพจ Instagram แบบไม่ออกหน้า จาก 0 ถึง 1 ล้านผู้ติดตามใน 365 วัน โดยให้แอด LINE และพิมพ์ `faceless`\n\n6. **12 ก.ย. 2026 เวลา 22:29 — คำทำนาย AI ของ Elon Musk**  \n   แจกบทความคำทำนาย 5 ข้อและ 6 Prompt พร้อมแจ้งโปร 9.9 หมดเขตเที่ยงคืนวันนั้น\n\n7. **14 ก.ย. 2026 เวลา 08:09 — YouTube Automation**  \n   เสนอคู่มือสร้างรายได้ $115,000/เดือนแบบ Step by Step โดยให้แอด LINE และพิมพ์ `ลิง` พร้อมโปรโมตคอร์สอีกครั้ง\n\n8. **26 ก.ย. 2026 — Talking Character ขายสินค้า (ส่งซ้ำ)**\n   แจ้งให้แอด LINE แล้วพิมพ์ `ขายของ` เพื่อรับคู่มือ Step by Step พร้อมแนบวิดีโอและคอร์สเดิม\n\n## งานที่อาจต้องทำ\n\nไม่มีงานที่ Kem Life มอบหมายโดยตรง หากต้องการใช้ทรัพยากรที่ส่งมา คุณอาจเลือกทำดังนี้:\n\n- เปิดอ่านคู่มือ Notion หรือดูวิดีโอ YouTube ตามหัวข้อที่สนใจ\n- หากต้องการคู่มือ **Faceless Instagram** ให้แอด LINE จากลิงก์ที่แนบ แล้วพิมพ์ `faceless`\n- หากต้องการคู่มือ **Talking Character ขายสินค้า** ตามข้อความล่าสุด ให้พิมพ์ `ขายของ` ใน LINE\n- หากต้องการคู่มือ **YouTube Automation** ให้แอด LINE จากลิงก์เดียวกัน แล้วพิมพ์ `ลิง`\n- หากสนใจคอร์ส ให้ตรวจราคาปัจจุบัน รายละเอียดแพ็กเกจ และความพร้อมใช้ของโค้ด `NOTION` ก่อนชำระเงิน เพราะแชทไม่ได้ระบุวันหมดอายุของโค้ด\n- ประเมินคำกล่าวอ้างด้านรายได้อย่างระมัดระวัง และตรวจต้นทุน เครื่องมือ ระยะเวลา และเงื่อนไขก่อนตัดสินใจ\n\n## กำหนดเวลา\n\n- **โปร 9.9:** ระบุว่าหมดเขตเที่ยงคืนของวันที่ส่งข้อความ คือ **12 กันยายน 2026** — หมดอายุแล้ว\n- **โค้ด `NOTION` ลด 10%:** ไม่มีวันหมดอายุระบุในแชท จึงควรตรวจสอบก่อนใช้\n- **“รีบสมัครก่อนขึ้นราคา”:** ไม่มีวันที่ขึ้นราคาหรือเส้นตายที่ชัดเจน\n- เป้าหมาย 365 วันของเพจ Faceless เป็นกรอบผลลัพธ์ในชื่อคู่มือ ไม่ใช่กำหนดส่งของคุณ\n\n## ลิงก์ที่แนบโดยตรง (ตัดรายการซ้ำแล้ว)\n\n1. [Talking Character ขายสินค้า — สิ่งของพูดได้แบบ Step by Step](https://app.notion.com/p/cryptodog/Talking-Character-Step-by-Step-3980157f27d780718fc6fc8515c05c5b?source=copy_link)  \n   คู่มือ Notion สำหรับทำคลิปตัวละครหรือสิ่งของพูดได้เพื่อขายสินค้า\n\n2. [(FULL COURSE) ทำเงินกับ ChatGPT + Shopee ไม่ต้องออกหน้า! ทำคลิป AI สุขภาพ ไวรัลด้วยแปะตะกร้า — YouTube](https://youtu.be/Jz1olhlDqf0?si=tcwmn-VsLFhJq-Rf)  \n   วิดีโอประกอบหัวข้อ Talking Character และการทำคลิปขายสินค้า\n\n3. [KEM LIFE Course — คอร์สสอนทำวิดีโอด้วย AI](https://www.aivideomastery.store)  \n   หน้าคอร์ส AI Video Mastery ถูกแนบซ้ำหลายข้อความ\n\n4. [GOODBYE CAPCUT — 7 Prompt ให้ Gemini เขียนสคริปต์และตัดต่อวิดีโอ](https://app.notion.com/p/cryptodog/GOODBYE-CAPCUT-7-Prompt-Gemini-3bc0157f27d781d38e4fcc1939aa3f6e?source=copy_link)  \n   คู่มือ Notion พร้อม Prompt ที่กดคัดลอกได้\n\n5. [เริ่มจากศูนย์วันนี้ — 7 ขั้นตอนสร้างรายได้ใหม่อีกครั้ง พร้อม Prompt](https://app.notion.com/p/cryptodog/7-Prompt-3ce0157f27d781149c07d9289bb2a425?source=copy_link)  \n   คู่มือ Notion สำหรับเริ่มต้นหาเงินด้วย AI\n\n6. [ถ้าผมกลับไปเริ่มจาก 0 ผมจะทำเงินด้วยสิ่งนี้ | วิธีหาเงินวันละ 1,000 จาก AI x Kem Life — YouTube](https://youtu.be/wCQh27o9AqQ?si=psJSKnft25o08rEi)  \n   วิดีโอประกอบคู่มือเริ่มจากศูนย์\n\n7. [ไม่ต้องมีประสบการณ์ ก็เริ่มหาเงินด้วย AI ได้ — 5 วิธีที่มือใหม่ทำจริง](https://app.notion.com/p/cryptodog/AI-5-3a60157f27d78182a751e79977c3b043?source=copy_link)  \n   คู่มือ Notion รายการนี้ถูกส่งซ้ำสองครั้ง\n\n8. [เพิ่มเพื่อน LINE เพื่อรับคู่มือ Faceless และ YouTube Automation](https://lin.ee/UHeV2ex)  \n   ใช้คีย์เวิร์ด `faceless` หรือ `ลิง` ตามคู่มือที่ต้องการ\n\n9. [อีก 5 ปี AI จะฉลาดเกินมนุษย์ทั้งโลกรวมกัน — คำทำนาย 5 ข้อของ Elon Musk พร้อม 6 Prompt](https://app.notion.com/p/cryptodog/5-AI-5-Elon-Musk--3d40157f27d781b3b047cfb53506e912?source=copy_link)  \n   บทความ Notion เกี่ยวกับอนาคต AI และสิ่งที่คนทั่วไปควรเตรียมตัว\n\n## ลิงก์โพสต์ต้นทางบน Facebook (ตัดรายการซ้ำแล้ว)\n\n1. [GOODBYE CAPCUT — รวม Prompt ที่ทำให้ Gemini...](https://www.facebook.com/100057221748816/posts/1590884116162298/)  \n   โพสต์ต้นทางของข้อความวันที่ 15 ส.ค. 2026\n\n2. [ถ้าเงินในบัญชีเหลือ 0 บาทตอนนี้...](https://www.facebook.com/100057221748816/posts/1606505047933538/)  \n   โพสต์ต้นทางของคู่มือเริ่มหาเงินด้วย AI จากศูนย์ วันที่ 4 ก.ย. 2026\n\n3. [เริ่มหาเงินด้วย AI ฉบับคนไม่มีประสบการณ์...](https://www.facebook.com/100057221748816/posts/1612887900628586/)  \n   โพสต์ต้นทางที่นำไปสู่ข้อความซ้ำในวันที่ 9 และ 13 ก.ย. 2026\n\n4. [เพจที่ไม่เคยโชว์หน้า ทำเงินได้เดือนละหลายหมื่น...](https://www.facebook.com/100057221748816/posts/1613945090522867/)  \n   โพสต์ต้นทางของคู่มือ Faceless Instagram วันที่ 12 ก.ย. 2026\n\n5. [อีก 5 ปี AI จะฉลาดเกินมนุษย์ทั้งโลกรวมกัน...](https://www.facebook.com/100057221748816/posts/1611261654124544/)  \n   โพสต์ต้นทางของบทความคำทำนาย Elon Musk วันที่ 12 ก.ย. 2026\n\n6. [ผมไปเจอคลิปนี้ ยอดวิวหลักร้อยล้าน...](https://www.facebook.com/100057221748816/posts/1617257040191672/)  \n   โพสต์ต้นทางของคู่มือ YouTube Automation วันที่ 14 ก.ย. 2026\n\n## ข้อความที่แนะนำให้ตอบ\n\n> ขอบคุณครับ ผมได้รับลิงก์และคู่มือแล้ว สนใจเนื้อหา Talking Character, Faceless และ YouTube Automation ครับ ขอสอบถามว่าทั้งสามคู่มือยังรับฟรีผ่าน LINE ได้อยู่ไหม และโค้ด NOTION ลด 10% ยังใช้ได้ถึงวันไหนครับ\n\n## หมายเหตุ\n\n- ไม่ได้ส่งข้อความ แอด LINE กรอกคีย์เวิร์ด กดรีแอ็กชัน หรือแก้ไขสิ่งใดใน Messenger\n- ชื่อหัวข้อลิงก์อ้างอิงจากข้อความในแชทและชื่อหน้าปลายทาง ณ วันที่ 18 กันยายน 2026\n","mew-social-summary-and-links.md":"# สรุปแชทและลิงก์จาก Mew Social\n\nช่วงข้อความที่ตรวจ: 23 สิงหาคม 2026 – 12 กันยายน 2026 · ตรวจล่าสุด 15 ตุลาคม 2026 ไม่พบข้อความใหม่หลัง 12 กันยายน เนื้อหาเดิมด้านล่างยังคงไว้\n\n> ตรวจซ้ำถึงวันที่ 28 กันยายน 2026: ไม่พบข้อความหรือลิงก์ใหม่หลังวันที่ 12 กันยายน\n\n## สรุปเนื้อหา\n\nแชทนี้มีข้อความหลัก 4 ชุด ซึ่งเป็นข้อความตอบอัตโนมัติหลังจากแสดงความคิดเห็นบนเพจ Mew Social\n\n1. **แผนสร้างรายได้/เส้นทางสู่ 100K** — แจ้งไลฟ์วันที่ 26 สิงหาคม 2026 เวลา 16:00 ทาง YouTube Mew Social พร้อมหน้าแผนย่อและการเลือกเส้นทาง โดยระบุว่าจะส่ง PDF ใต้คอมเมนต์หลังไลฟ์\n2. **ชุดเริ่มต้น Astra 6 ชิ้น** — ประกอบด้วย 100 ประโยคสั่งงานภาษาไทย, ตัวอย่างบันทึกขออนุมัติงบ, ข้อมูลแพ็กเกจและระดับ effort, วิธีตั้งค่า 10 นาที, แนวทางข้อมูลที่ส่งให้ AI ได้/ไม่ได้ และคำถามเข็มทิศ 7 ข้อ วิธีรับคือแอด LINE แล้วพิมพ์คำว่า `ASTRA` พร้อมแจ้งไลฟ์สาธิตวันที่ 9 กันยายน 2026 เวลา 16:00\n3. **ชุดคำสั่ง Astra และคลังแสง AI** — ส่งหน้าชุดคำสั่ง Astra โดยตรง, หน้ารายละเอียดคลังแสง AI และ LINE สำหรับขอคำแนะนำว่าควรเริ่มจากตรงไหน\n4. **คลิป AI Agent สำหรับผู้ไม่เขียนโค้ด** — อธิบายว่า AI Agent คืออะไร และตัวอย่างงาน 5 อย่างที่สามารถช่วยทำแทนได้\n\n## งานที่ควรทำ\n\n- หากต้องการใช้ชุดคำสั่งทันที ให้เริ่มจากหน้าชุดคำสั่ง Astra\n- หากต้องการชุดไฟล์ที่แจกผ่านระบบ ให้แอด LINE และพิมพ์ `ASTRA`\n- หากกำลังพิจารณาซื้อหรือเรียนต่อ ให้ดูรายละเอียดคลังแสง AI ก่อน แล้วค่อยติดต่อ LINE เพื่อถามว่าแพ็กเกจใดเหมาะกับงาน\n- ตรวจหน้า YouTube สำหรับวิดีโอย้อนหลัง เนื่องจากกำหนดการไลฟ์ทั้งหมดผ่านไปแล้ว\n\n## กำหนดเวลาที่กล่าวถึง\n\n- 26 สิงหาคม 2026 เวลา 16:00 — ไลฟ์แผนสร้างรายได้/เส้นทาง 100K (ผ่านไปแล้ว)\n- 9 กันยายน 2026 เวลา 16:00 — ไลฟ์สาธิต Astra ทำงานหลังบ้าน 4 งาน (ผ่านไปแล้ว)\n\nไม่พบงานหรือกำหนดส่งที่ Mew Social มอบหมายให้คุณโดยตรง\n\n## ลิงก์ตรงที่แนบในข้อความ\n\n1. [YouTube Mew Social — ช่องหลักและวิดีโอย้อนหลัง](https://youtube.com/@mewsocial?sub_confirmation=1)\n2. [แผนย่อและเลือกเส้นทางสู่ 100K](https://klungsang.mewsocial.com/100k?ref=100k-fb)\n3. [LINE Mew Social — รับไฟล์ ASTRA และสอบถามเพิ่มเติม](https://lin.ee/IApRa7t)\n4. [ชุดคำสั่ง Astra](https://chatgpt.mewsocial.com/astra)\n5. [รายละเอียดคลังแสง AI](https://link.mewsocial.com/facebookpage)\n6. [วิดีโอ: AI Agent คืออะไร — 5 งานที่ทำแทนคุณได้โดยไม่ต้องเขียนโค้ด](https://www.youtube.com/watch?v=mXSY15yidDc)\n7. [เพจ Mew Social](https://www.facebook.com/169230793119014/)\n\n## ลิงก์โพสต์/คอมเมนต์ต้นทาง\n\n1. [ต้นทางข้อความแผน 100K และไลฟ์วันที่ 26 สิงหาคม](https://facebook.com/100064714087461/posts/1527112602789195/?comment_id=1375147617447580)\n2. [ต้นทางข้อความชุดเริ่มต้น Astra และไลฟ์วันที่ 9 กันยายน](https://facebook.com/100064714087461/posts/1539804131520042/?comment_id=1010665498653290)\n3. [ต้นทางข้อความชุดคำสั่ง Astra และคลังแสง AI](https://facebook.com/100064714087461/posts/1542304981269957/?comment_id=1233450533194780)\n4. [ต้นทางข้อความคลิป AI Agent สำหรับผู้ไม่เขียนโค้ด](https://facebook.com/100064714087461/posts/1545050560995399/?comment_id=1532944322203923)\n\n## ข้อความตอบกลับที่แนะนำ\n\nข้อความส่วนใหญ่เป็นระบบอัตโนมัติ จึงไม่จำเป็นต้องตอบ หากต้องการสอบถามว่าสื่อเดิมยังรับได้หรือไม่ สามารถใช้ข้อความนี้:\n\n> สวัสดีครับ ผมได้รับลิงก์ชุดคำสั่ง Astra และคลิป AI Agent แล้วครับ ขอสอบถามว่าชุดไฟล์จากไลฟ์และ PDF แผน 100K ยังสามารถรับย้อนหลังได้อยู่ไหมครับ หากได้ รบกวนแนะนำช่องทางรับไฟล์ให้ด้วยครับ ขอบคุณครับ\n","puvanet-da-ai-summary-and-links.md":"# สรุปแชท Puvanet Da — เฉพาะเรื่องการใช้งาน AI\n\nอัปเดตจากประวัติแชทที่ตรวจอ่านได้ช่วง **17 สิงหาคม–15 ตุลาคม 2026** · ตรวจล่าสุด 15 ตุลาคม 2026 โดยคัดเฉพาะข้อความและลิงก์เรื่อง AI และการนำไปใช้ทำงาน/ธุรกิจ เนื้อหาอื่นไม่ได้รวมไว้ ยังไม่ได้อ่านภาพและวิดีโอทุกชิ้น\n\n## อัปเดตใหม่ 6–15 ตุลาคม 2026\n\n### ประเด็นสำคัญ\n\n- **ผลลองจริง:** Puvanet บอกว่า AI ส่งรายงานให้ทุกเย็น แต่ต้องเปิดคอมไว้ มีการคุยเรื่อง Dots และ Hermes เชื่อม Codex เพื่อคุมงานโค้ดข้ามคืน คุณให้ความเห็นว่าทำงานได้แต่ใช้ทรัพยากรมาก อาจเพราะสั่งกว้างเกินไป ยังไม่มีตัวเลขค่า Token หรือผลเปรียบเทียบที่แน่นอน\n- **งานซ้ำให้เปลี่ยนเป็นเครื่องมือ:** โพสต์ Report Center เสนอให้ AI สร้างและตรวจ SQL/Python แล้วเก็บสคริปต์พร้อมเวอร์ชัน นำมาสร้าง GUI เรียกใช้ซ้ำ แทนสั่งสร้างรายงานใหม่ทุกเดือน\n- **Context / Memory / คุณภาพงาน:** pstack, CLAUDE.md, claude-mem, Skill checklist และการ Handoff ข้ามแชท พร้อมข้อเตือนเรื่อง Agent แก้ Test ให้ผ่านแทนแก้ Bug ควรตรวจ diff และทดสอบพฤติกรรมเดิมด้วย\n- **ทีม Agent และ MCP:** มี OpenRig, Kafka ให้ Agent ต่างเครื่องสื่อสาร, Designing MCP Gateway, Managed Agents และ ego lite คุมเบราว์เซอร์ ทั้งหมดเป็นเนื้อหาในโพสต์ที่แชร์ ไม่ได้ติดตั้งหรือทดสอบในรอบนี้\n- **ตัวอย่างงาน:** AIHOT คัด/รวมข่าว, Claude ช่วย Python + API สร้างฐานข้อมูล, วิเคราะห์ ERP, สร้าง SaaS แล้ว Deploy VPS, Motion Design, Blender และเว็บ 3D กายวิภาค\n- **ข้อจำกัด:** ข่าวความสามารถ/แพ็กเกจ/วันเปิดใช้ของ Claude และ Copilot รวมถึงข้ออ้าง Follow-up Agents ส่งนอก 24 ชั่วโมง เป็นคำกล่าวของโพสต์ ยังไม่ได้ยืนยันต้นทางหรือสิทธิ์บัญชี ไม่ควรใช้เป็นนโยบายแพลตฟอร์มที่ยืนยันแล้ว\n\n### งานค้าง กำหนดเวลา และข้อความที่ควรตอบ\n\n- ถ้าจะทดลองงานข้ามคืน ให้กำหนดงานเล็ก เกณฑ์ผ่าน งบ Token และจุดที่ต้องให้คนอนุมัติ แล้วเทียบเวลา/ค่าใช้จ่ายจริง\n- ขอชื่อและวิธีตั้งค่าระบบรายงานประจำวัน รวมถึงต้นทุนจริงจาก Puvanet ยังไม่มีวันนัดหรือกำหนดส่งงาน AI ใหม่ที่ยืนยัน\n- ฉบับร่าง: “ระบบส่งรายงานทุกเย็นใช้ตัวไหน ตั้งค่าอย่างไรครับ? ลอง Hermes/Codex แล้วค่า Token ต่อคืนประมาณเท่าไร มีขอบเขตงานแบบไหนที่คุมค่าใช้จ่ายได้ดี?” ยังไม่ได้ส่ง\n\n### ลิงก์ใหม่พร้อมหัวข้อ\n\n- 6 ต.ค. — [ตรวจ Agent แก้ Bug จริง ไม่ใช่แก้ Test ให้ผ่าน](https://www.facebook.com/share/p/1Fx9dKe52M/?mibextid=wwXIfr)\n- 6 ต.ค. — [pstack ของ poteto: ชุด Skills ตามโพสต์ไทยไทป์](https://www.facebook.com/share/p/1at39an2AX/?mibextid=wwXIfr)\n- 6 ต.ค. — [คำถามเรื่อง Handoff งาน Claude ข้ามแชทและ Context](https://www.facebook.com/share/p/1EcyoFfbbD/?mibextid=wwXIfr)\n- 6 ต.ค. — [Claude Mods: ดูแลข้อมูลส่วนตัวและตรวจ Token ตามโพสต์](https://www.facebook.com/share/p/19WbPadWmU/?mibextid=wwXIfr)\n- 6 ต.ค. — [Claude Code ทำ Motion Design: ตัวอย่างของ Warit](https://www.facebook.com/share/v/14tyumEK7L3/?mibextid=wwXIfr)\n- 6 ต.ค. — [ต้นทาง Thread Motion Design ที่ระบุในข้อความ](https://x.com/0xMovez/article/ l เพื่อให้ระบบเดินงานตามแผนต่อเนื่องได้นานหลายชั่วโมง แนวทางที่ทั้งสองคนเห็นร่วมกันคือ Plan → แตก Task/Milestone → เปิด Goal → ตรวจผลเป็นระยะ\n- **AI ทำให้ระยะเวลาพัฒนาสั้นลงมาก แต่การคิดราคาต้องเปลี่ยน** — เมื่อ AI ช่วยให้ทำงานเร็วขึ้นหลายเท่า การคิดราคาจากจำนวนวันทำงานอย่างเดียวอาจไม่เหมาะ ควรแยกคุณค่าของการวิเคราะห์ ออกแบบ ตัดสินใจ และความรับผิดชอบของคนออกจากเวลาลงมือเขียนระบบ\n- **ทดลอง Hermes คุม VS Code** — มีการลองรัน Hermes ควบคู่กับ VS Code และให้ Hermes เป็นตัวคุมงานอีกชั้น ระบบยังอยู่ในช่วงทดลองและยังไม่มีข้อสรุปผลลัพธ์\n- **ระวังข้อมูลส่วนตัวใน AI Passport** — มีการพูดถึง AI Passport แต่ยังไม่เห็น Use Case ที่จำเป็น จึงเลือกไม่ส่งข้อมูลส่วนตัวเข้าไปจนกว่าจะเข้าใจวัตถุประสงค์และความเป็นส่วนตัวชัดเจน\n- **เริ่มเห็นตัวอย่าง AI สร้างงานจริงหลายรูปแบบ** — ตั้งแต่เกมที่สร้างด้วย Astra, Social Monitoring ด้วย Claude + Social API, ตรวจ Security/Architecture, Blender ผ่าน MCP ไปจนถึงหลักสูตร AI Engineering และเครื่องมือเปิด localhost สำหรับ Agent\n- **FSD และระบบขับขี่อัตโนมัติใกล้ใช้งานมากขึ้น** — เป็นมุมมองเชิงแนวโน้มว่า AI อาจเปลี่ยนพฤติกรรมการเป็นเจ้าของรถ แต่ยังไม่มีงานหรือการตัดสินใจที่ต้องทำทันที\n\n### งานที่ควรทำต่อจากอัปเดตนี้\n\n1. ทดลอง Workflow `Plan → Task/Milestone → Goal` กับงานเล็กหนึ่งชิ้น และกำหนดจุดตรวจทุก Milestone\n2. ทำสูตรเสนอราคาใหม่ที่แยกค่าการวิเคราะห์/ออกแบบ/รับผิดชอบระบบ ออกจากเวลาที่ AI ช่วยลดลง\n3. เก็บผลทดลอง Hermes + VS Code ว่าแบ่งบทบาทอย่างไร เกิดปัญหาซ้ำซ้อนตรงไหน และช่วยลดเวลาจริงหรือไม่\n4. ทดลองเครื่องมือใหม่ด้วยข้อมูลจำลองก่อน โดยเฉพาะ AI Passport และเครื่องมือที่ต้องเข้าถึงไฟล์หรือข้อมูลส่วนตัว\n5. เลือกลิงก์ใหม่ 1–2 รายการมาทดลองจริง เช่น Social Monitoring หรือ Codex + Blender MCP แทนการเปิดหลายแนวพร้อมกัน\n\n### กำหนดเวลาใหม่\n\n- ในช่วงข้อความใหม่ **ยังไม่มีเส้นตายที่ตกลงกันชัดเจน**\n- การทดลอง Goal, Hermes, AI Passport และแนวทางคิดราคาเป็นงานต่อเนื่อง ควรกำหนดวัน Review เองเมื่อเลือก Use Case ทดลองแล้ว\n\n## สรุปสั้นที่สุด\n\nบทสนทนานี้สะท้อนว่าทั้งสองคนกำลังขยับจาก “ใช้ AI ช่วยตอบ” ไปสู่ “สร้างระบบ AI ทำงานร่วมกันจริง” โดยเฉพาะ Claude, Codex, Hermes, Skills และ MCP เป้าหมายที่เห็นชัดคือทำระบบ/โปรดักต์ที่มีหลาย Agent ช่วยวางแผน เขียนโค้ด ตรวจงาน จัดการความจำ และเชื่อมเครื่องมือต่าง ๆ พร้อมมองหาแนวทางนำไปขายหรือใช้กับธุรกิจจริง\n\nประเด็นที่ค้างอยู่คือระบบเริ่มซับซ้อนเมื่อเชื่อมหลายส่วน, Blueprint ยังต้องแก้, MCP ยังไม่เคยลองจริงและต้องหาข้อมูล/คอร์สเพิ่ม รวมถึงมีความสนใจไป Workshop AI ด้วยกันเมื่อประกาศวันชัดเจน\n\n## ประเด็นสำคัญ\n\n### 1. ระบบ AI Agent หลายตัวและการออกแบบสถาปัตยกรรม\n\n- Puvanet กำลังแก้ Blueprint ของระบบ และพบว่าเมื่อผูกระบบหลายส่วนเข้าด้วยกันแล้วเริ่มสับสน\n- มีการเสนอให้ใช้มุมมอง System Analysis & Design (SA) ช่วยจัดโครงสร้างก่อนลงมือ\n- Codex ช่วยทำหน้าที่คล้าย SA ได้บางส่วน แต่สำหรับระบบใหญ่ยังควรให้คนตรวจและปรับ\n- สนใจการใช้ Hermes เป็นตัวกลางวางแผน/แตกงาน แล้วกระจายงานให้ Claude Code และ Codex\n- สนใจ Orca สำหรับควบคุม Coding Agent หลายตัว และ Git Worktree เพื่อแยกพื้นที่ทำงานก่อน Review/Merge\n- มีความตั้งใจสร้างระบบให้ Agent หลายตัวทำงานร่วมกัน และแชร์เป็น Git/Repo ให้ Puvanet ทดลอง\n\n### 2. MCP และ Skills\n\n- Puvanet ถามว่ามี MCP หรือ Skill ที่ช่วยจัดการระบบหรือไม่ และยอมรับว่ายังไม่เคยลอง MCP\n- คำอธิบายในแชทมอง MCP ว่าเป็นมาตรฐานสำหรับให้ AI Agent เชื่อมเครื่องมือ/ส่งข้อมูลงานกัน คล้าย API สำหรับยุค Agent\n- ทั้งสองฝ่ายเห็นตรงกันว่า MCP ค่อนข้างเทคนิค และควรหาข้อมูลหรือคอร์สเพิ่มก่อน\n- มีความสนใจ Agent Skills, Handoff และ Template Creator เพื่อเก็บรูปแบบงาน/ส่งต่องานโดยไม่ต้องอธิบายใหม่ทุกครั้ง\n\n### 3. Workflow ทำซอฟต์แวร์ด้วย AI\n\n- แนวทางที่แชร์กันบ่อยคือให้ AI เริ่มจากสัมภาษณ์ความต้องการ → เขียน Spec → แตกเป็น Ticket ที่ใช้งานได้จริง → Implement แบบ TDD → Code Review\n- ไม่ควรสั่งเพียง “สร้างเว็บให้หน่อย” แต่ต้องระบุเป้าหมาย ขอบเขต ตัวอย่าง และเกณฑ์ผ่าน\n- แนะนำให้แยกบทบาท เช่น ChatGPT ช่วยคิด/วางแผน, Codex ลงมือทำ, Claude Code ตรวจหรือแก้จุดเฉพาะ\n- มีแนวคิดใช้ Dashboard คุมงาน Claude + Codex และสร้าง Brief สำหรับกลับมาทำงานต่อวันถัดไป\n- Puvanet ขอให้แชร์ระบบที่กำลังเขียนให้ Agent ทำงานร่วมกันเมื่อพร้อม\n\n### 4. ความจำระยะยาวและการประหยัด Token\n\n- มีการแชร์วิธีใช้ Vector Database/Embeddings เพื่อให้ Agent ดึงเฉพาะความทรงจำที่เกี่ยวข้อง แทนการแบกประวัติแชทยาวทั้งหมด\n- ตัวอย่างใช้ BGE-M3, Google Colab GPU, Google Drive และ sqlite-vec เพื่อจัดการข้อมูลมากกว่า 50,000 รายการ โดยอ้างว่าช่วยลด Token ได้มาก\n- วิธีง่ายกว่าสำหรับงานทั่วไปคือให้ AI เขียน `summary.md` หรือ `todo.md` ก่อนเปิดแชทใหม่ แล้วสั่งให้อ่านไฟล์นั้นเพื่อทำต่อ\n- มีเครื่องมือและแนวคิดลด Token เช่น RTK, Context Mode, Code Review Graph และการลด Output ที่ไม่จำเป็น\n- No AI Slop ใช้ตรวจ “กลิ่นภาษา AI” แล้วปรับให้ยังคงน้ำเสียงของผู้เขียน\n\n### 5. การนำ AI ไปใช้กับธุรกิจ\n\n- สนใจ AI Customer Chat Agent สำหรับอ่านแชท Facebook/LINE, ดูรูปหรือสลิป, ตอบลูกค้า และส่งต่อเคสที่ต้องใช้คน\n- มองว่าควรสร้าง Skill ที่รวมความรู้ธุรกิจ ราคา โปรโมชัน น้ำเสียง กฎการตอบ และตัวอย่างบทสนทนาไว้ในที่เดียว\n- สนใจให้ AI ถอดกระบวนการทำงานเป็น SOP เพื่อลดการพึ่งพาคนใดคนหนึ่ง\n- สนใจ AI ช่วยวิเคราะห์ Keyword/การมองเห็นของร้านบน Google, ChatGPT และ Claude\n- มีไอเดียผู้ช่วยผ่าน LINE เช่น เลขาหลายตัว หรือ “คุณโน้ต” สำหรับงาน ปฏิทิน รายรับรายจ่าย และแจ้งเตือน\n- มีการใช้ AI ประเมินมูลค่าระบบที่ Puvanet ทำ โดยคำตอบในแชทประเมินว่าหากจ้างทีม Senior อาจมีมูลค่าราว 9.6 ล้านบาท แต่ตัวเลขนี้ควรใช้เป็นเพียงจุดตั้งต้นและต้องตรวจสมมติฐานต้นทุนอีกครั้ง\n\n### 6. Vibe Coding และตัวอย่างโปรดักต์\n\n- แชร์ตัวอย่างเว็บ/แอปที่สร้างด้วย Vibe Coding จำนวนมาก เพื่อดูไอเดียและรูปแบบตลาด\n- ตัวอย่างที่เด่นคือ Homie แอปจัดการบ้าน, คุณโน้ตใน LINE, Project Planner, Personal CFO และเครื่องมือสร้างเว็บ/แอปโดยไม่ต้องเขียนโค้ดเองทั้งหมด\n- มีแนวคิดให้ AI ช่วยออกแบบ UI ผ่าน Prompt ราย Section และใช้ Design Skills เพื่อยกระดับ Interface\n- Claude Cowork ถูกมองว่าเหมาะกับงานเอกสาร สไลด์ ดีไซน์ และงานที่ต้องเชื่อมไฟล์ในเครื่อง\n\n### 7. ความปลอดภัย ความเป็นส่วนตัว และขอบเขตการใช้ AI\n\n- แนวทาง Local AI + Hermes + Cloud AI: ให้งานทั่วไป/ข้อมูลภายในทำในเครื่อง และส่งเฉพาะงานซับซ้อนไป Cloud\n- ก่อนส่ง Cloud ควร Mask ชื่อ เบอร์โทร ข้อมูลลูกค้า และส่งเฉพาะ Context ที่จำเป็น\n- มีการแชร์ความเสี่ยงของการใช้ Claude/Agent ในงานไซเบอร์ การสอดแนม IO อาวุธ ชีววิทยา และการขโมยโมเดล เพื่อย้ำว่า Agent เป็นตัวคูณทั้งงานดีและงานอันตราย\n- งานที่ให้ AI ตรวจพื้นที่เก็บข้อมูลควรสั่ง “วิเคราะห์และจัดหมวดหมู่เท่านั้น ห้ามลบ” แล้วให้คนตัดสินใจ\n\n## งานที่ควรทำต่อ\n\n1. **จัด Blueprint ระบบใหม่** — วาดองค์ประกอบ, ข้อมูลเข้า/ออก, เจ้าของข้อมูล, Agent แต่ละตัว และจุดที่ต้องให้คนอนุมัติ\n2. **ทำ MVP เล็กก่อน** — เลือก Use Case เดียว เช่น CMMS, Customer Chat Agent หรือผู้ช่วยงานผ่าน LINE แล้วกำหนดเกณฑ์ผ่านให้ชัด\n3. **ทดลอง MCP แบบจำกัดขอบเขต** — เริ่มจากเครื่องมือเดียวและข้อมูลทดสอบ ไม่เชื่อมระบบทั้งหมดพร้อมกัน\n4. **กำหนด Workflow Agent** — ใครวางแผน, ใครเขียน, ใครตรวจ, ใช้ Handoff/ไฟล์สรุปแบบใด และคนต้อง Review ตรงไหน\n5. **ทำระบบความจำขั้นต่ำ** — เริ่มด้วย `summary.md`/`todo.md`; ถ้าข้อมูลโตจริงค่อยทดสอบ Vector DB\n6. **ทดสอบ Dashboard/Repo ร่วมกัน** — เมื่อระบบที่ให้ Agent ทำงานร่วมกันพร้อม ให้ส่ง Repo หรือ Demo ให้ Puvanet ทดลอง\n7. **ติดตามคอร์สหรือ Workshop** — หาคลาส MCP/Agent Architecture ที่ไม่พื้นฐานเกินไป และเช็กวัน Workshop ที่เชียงใหม่/มหิดลก่อนนัดไปด้วยกัน\n8. **ตรวจตัวเลขมูลค่าระบบ** — แตกขอบเขต ฟีเจอร์ ชั่วโมงทำงาน และต้นทุนจริง ก่อนใช้ตัวเลข 9.6 ล้านบาทในการคุยธุรกิจ\n\n## กำหนดเวลาและสถานะ\n\n- **Workshop ChatGPT-6 Astra ที่เชียงใหม่** — ในแชทยังไม่มีวันจัด; Puvanet บอกว่าสนใจถ้ามีวันชัดเจนเพื่อเช็กว่าว่างตรงกันหรือไม่\n- **คลาส/อบรมที่มหิดล** — มีการพูดถึงแต่ไม่เห็นวันเวลาในข้อความที่อ่านได้ และมีข้อกังวลว่าเนื้อหาอาจพื้นฐานเกินไป\n- **คอร์ส WebApp ฟรี** — โพสต์ระบุว่าอาจเปิดฟรี 30 วันถ้าคนสนใจไม่มาก แต่ไม่มีวันปิดรับที่แน่นอนในแชท\n- **Claude ขยายโควตา 2 เท่า** — โพสต์ในแชทระบุหมดวันที่ 31 สิงหาคม 2026 ซึ่งผ่านไปแล้ว\n- งานด้าน Blueprint, MCP, CMMS และระบบ Agent ร่วมกัน **ไม่มีเส้นตายที่ตกลงกันชัดเจน**\n\n## ลิงก์ที่เกี่ยวข้องกับ AI พร้อมหัวข้อ\n\n### Agent, Claude, Codex และ Workflow\n\n1. [Dashboard คุมงาน Claude + Codex พร้อมบรีฟทำงานต่อ](https://www.facebook.com/share/p/188CWYqpRQ/?mibextid=wwXIfr)\n2. [Claude Code + Codex โดยใช้ Hermes วางแผนและกระจายงาน นะ แกนหลักมี 4 เรื่อง: 1) จัด Blueprint ระบบกับบทบาท Agent ให้ชัด 2) ลอง MCP แบบเล็ก ๆ ก่อน 3) ทำ workflow Hermes + Claude/Codex พร้อมจุดให้คนตรวจ 4) ทำ memory/handoff ด้วย summary.md ก่อนค่อยขยับไป Vector DB ถ้ามึงส่ง Blueprint ล่าสุดมา เดี๋ยวกูช่วยแตกเป็นระบบย่อยกับแผนทดลอง MVP ให้ แล้วค่อยเลือกว่าจะเริ่มจาก CMMS หรือ Customer Chat Agent ดี ส่วน Workshop ถ้ามีวันประกาศชัดแล้วส่งมา เดี๋ยวเช็กวันไปด้วยกัน\n\n**ข้อความตอบเพิ่มเติมสำหรับรอบล่าสุด**\n\n> Goal น่าสนใจ เดี๋ยวกูจะลองกับงานเล็กก่อน โดยให้มัน Plan และแตก Milestone ให้ครบ แล้วค่อยเปิด Goal รันยาว แต่จะตั้งจุดตรวจไว้ไม่ให้หลุด ส่วนเรื่องราคาเห็นด้วยว่าคงลดเฉพาะเวลาลงมือ แต่ค่าคิด วิเคราะห์ ออกแบบ และรับผิดชอบระบบยังต้องอยู่ ถ้ามึงลอง Hermes คุม VS Code ได้ผลแค่ไหนส่งสรุปมา เดี๋ยวเอามาเทียบ Workflow กัน\n\n## หมายเหตุ\n\n- ไม่ได้ส่งข้อความ กดรีแอ็กชัน หรือแก้ไขสิ่งใดใน Messenger\n- ลิงก์และคำกล่าวอ้างในแชทเป็นข้อมูลจากบุคคลที่สาม ควรตรวจสอบอีกครั้งก่อนนำไปใช้จริง โดยเฉพาะราคา ความสามารถของโมเดล โควตา API และตัวเลขประสิทธิภาพ\n- รายการนี้ตัดลิงก์ที่ไม่เกี่ยวกับ AI และลิงก์ที่ไม่มีบริบทเพียงพอออกแล้ว\n","somchai-ai-summary-and-links.md":"# สมชาย เสงี่ยมศักดิ์ — AI\n\n## อัปเดต 2 พฤศจิกายน 2026 — อ่านถึงข้อความ 21:44 น.\n\nอ่านรายการข้อความย้อนหลังต่อจากจุดเดิม 29 ต.ค. 15:09 ถึง 2 พ.ย. 21:44 รวมตัวอย่างโพสต์ที่แสดงใน Messenger ไม่ได้เปิดปลายทางทุกลิงก์หรือถอดภาพ/วิดีโอ ช่องว่างเก่า 15–21 ต.ค. และ 22 ต.ค. 08:08–27 ต.ค. 11:46 ยังไม่ได้เติมครบ\n\n### ความรู้จากโพสต์ที่แชร์ — ยังไม่ใช่คำแนะนำตรงจากสมชาย\n\n- **Aetox Harness — 2 พ.ย. 21:43:** ผู้เขียนเล่าการใช้ harness ร่วมกับผู้ให้บริการโมเดลอื่นแทนบริการเดิม และกล่าวถึง memory, MCP, ทีม agent และ browser แนวคิดที่เก็บได้คือแยกตัวจัดการงาน agent ออกจากผู้ให้บริการโมเดล ตัวเลขราคา โควตา จำนวนผู้ให้บริการ และคำกล่าวว่าข้อมูลอยู่ในเครื่องเป็นคำกล่าวของผู้เขียน ยังไม่ได้ตรวจหรือทดลอง จึงไม่ยืนยันว่าใช้งานแล้วข้อมูลไม่ส่งออก\n- **Subagent + Jev AI — 31 ต.ค. 22:00:** โพสต์เสนอแบ่งไฟล์ให้ลูกทีมรับผิดชอบ แล้ววนเขียน–ตรวจ–แก้–ตรวจใหม่ ก่อนรันเทสต์จริง เหมาะเก็บเป็นแนวคิดเรื่องขอบเขตไฟล์และรอบตรวจคุณภาพ ตัวเลขความเสี่ยง ความเร็วและต้นทุนในโพสต์ยังไม่มีผลทดสอบของเรา ไม่ใช้คำอนุมัติของโมเดลแทนการทดสอบจริง\n- **Overmind — 31 ต.ค. 01:50:** ตัวอย่างโพสต์อธิบายการใช้ข้อมูลการทำงานจริงของ agent เพื่อฝึกและประเมินโมเดลเฉพาะงาน ยังไม่มีรายละเอียดชุดข้อมูล สิทธิ์ใช้ข้อมูล หรือขั้นตอนติดตั้งในแชท\n- **1Password for Agents — 1 พ.ย. 08:39:** ตัวอย่างโพสต์กล่าวถึงการให้ agent ล็อกอินโดยไม่เห็นรหัส เป็นแหล่งศึกษาเรื่องจัดการข้อมูลเข้าสู่ระบบ ยังไม่ได้เชื่อมบัญชีหรือยืนยันความสามารถและเงื่อนไขจริง\n- **สร้าง AI agent ด้วย Claude Code 5 ขั้นตอน — 2 พ.ย. 15:29:** ตัวอย่างแสดงเพียงหัวข้อ จึงเก็บลิงก์อ่านต่อ ยังไม่แต่งรายละเอียดทั้งห้าขั้นตอน\n\n### ลิงก์ใหม่พร้อมหัวข้อ\n\n- [Aetox Harness — ประสบการณ์ใช้ harness กับผู้ให้บริการโมเดล](https://www.facebook.com/share/p/1CZwboVJT4/) — คุณแชร์ 2 พ.ย. 21:43\n- [Aetox Harness — repository ที่ผู้เขียนแนบ](https://github.com/Mikedev115/Aetox-Harness) — พบในตัวอย่างโพสต์ ยังไม่ได้ตรวจโค้ด\n- [Aetox — Microsoft Store ที่ผู้เขียนแนบ](https://apps.microsoft.com/detail/9N4KKBRRSCZZ) — ยังไม่ได้ติดตั้ง\n- [Aetox — เว็บไซต์แนะนำที่ผู้เขียนแนบ](https://mikedev115.github.io/Aetox-landing/) — ยังไม่ได้เปิดปลายทาง\n- [Subagent + Jev AI — วนตรวจและแก้โค้ดก่อนรันเทสต์](https://www.facebook.com/share/p/1RufbeiYms/) — คุณแชร์ 31 ต.ค. 22:00\n- [Overmind — ใช้ข้อมูล agent พัฒนาโมเดลเฉพาะงาน ตามตัวอย่างโพสต์](https://x.com/peesamac/status/2116032513982464365) — คุณแชร์ 31 ต.ค. 01:50\n- [1Password for Agents — แนวคิดให้ agent เข้าบัญชีตามโพสต์](https://x.com/peesamac/status/2116342098362519896) — คุณแชร์ 1 พ.ย. 08:39\n- [สร้าง AI agent ด้วย Claude Code 5 ขั้นตอน — เห็นเฉพาะหัวข้อ](https://www.facebook.com/share/p/19gDQogzaY/) — คุณแชร์ 2 พ.ย. 15:29\n\n**บทสนทนาและงานค้าง:** รอบนี้ยังไม่พบคำอธิบายติดตั้ง/config ของเครื่องมือเหล่านี้ที่สมชายตอบโดยตรง ไม่มีงาน AI หรือกำหนดส่งใหม่ที่ยืนยัน หากจะทดลอง ข้อเสนอของผู้ช่วยคือเลือกงานเล็กที่ไม่ลับ วัดผลกับ workflow เดิม และเก็บค่าใช้จ่ายกับข้อผิดพลาดจริงก่อนเปลี่ยนเครื่องมือ ยังไม่ได้ส่งข้อความหรือทดลองติดตั้ง\n\n---\n\n## อัปเดต 29 ตุลาคม 2026 — อ่านถึงข้อความ 15:09 น.\n\nรอบนี้ตรวจข้อความและตัวอย่างไฟล์แนบที่โหลดช่วง 27 ต.ค. 11:46–29 ต.ค. 15:09 วันที่ 27–28 อ้างอิงป้ายวันอังคาร/วันพุธเทียบกับวันอ่าน ยังขาดช่วง 22 ต.ค. 08:08–27 ต.ค. 11:46 และช่องว่างเดิม 15–21 ต.ค. การอ่านย้อนหลังหยุดเมื่อเบราว์เซอร์ค้าง ไม่ได้เปิดทุกโพสต์หรือถอดภาพ\n\n### จากบทสนทนาโดยตรง\n\n- **28 ต.ค. 09:20–09:25:** คุณถามว่ายังใช้ Hermes อยู่ไหม สมชายตอบว่า “ใช้อยู่นะ” ยืนยันเพียงว่ายังใช้ ไม่มี config หรือเทคนิคติดตั้งเพิ่มเติมในข้อความนี้\n- **28 ต.ค. 15:37:** คุณกล่าวถึงการสร้างทีม agent ให้ทำงาน เป็นข้อความเล่าการใช้งาน ยังไม่มีรายละเอียดการแบ่งงาน สิทธิ์เครื่องมือ หรือผลตรวจคุณภาพพอจะทำคู่มือตั้งค่าได้\n- **29 ต.ค. 09:29–09:30:** ในบทสนทนาเรื่องราคา upgrade คุณเปรียบเทียบกับ Claude สมชายอธิบายว่าจ่ายตามวันที่เหลือใช้ รอบถัดไปจึงจ่ายเต็ม เป็นคำอธิบายในแชท ยังไม่ยืนยันผู้ให้บริการหรือแพ็กเกจต้นทางจากภาพ จึงไม่ใช้เป็นนโยบายราคาของบริการใดโดยทั่วไป\n\n### โพสต์ที่แชร์ใหม่ — เก็บเป็นแหล่งอ่านต่อ\n\n- [Prompt injection ที่ยกระดับขึ้นอีก — ยังไม่ได้เปิดตรวจเนื้อหาเต็ม](https://www.facebook.com/share/p/1KnSLeSQTp/) — คุณแชร์ 28 ต.ค. 13:17; ตัวอย่างมีเพียงหัวข้อ ยังไม่สรุปกลไกหรือวิธีป้องกัน\n- [แลกเปลี่ยนเวลาพัฒนาระบบ ERP ด้วย AI — ยังไม่มีรายละเอียดผลทดสอบ](https://www.facebook.com/share/p/1CNd1J7wcx/) — คุณแชร์ 28 ต.ค. 10:59; คุยต่อเป็นความเห็นเรื่องการเปรียบเทียบเวลาทำระบบ ยังไม่ใช่หลักฐานว่าคุณภาพหรือขอบเขตงานเท่ากัน\n\n**งานติดตาม:** หากจะรวบรวมเทคนิค Hermes ให้ขอ workflow/config ที่ตัดข้อมูลลับแล้ว พร้อมงานตัวอย่างและผลตรวจ ไม่มีการมอบหมายงาน AI หรือกำหนดส่งใหม่ที่ยืนยันในช่วงที่อ่าน ข้อความตอบและคำถามติดตามยังไม่ได้ส่ง\n\n---\n\n## ตรวจข้อความใหม่ 22 ตุลาคม 2026 — ถึง 08:08 น.\n\nอ่านช่วงท้ายของแชทต่อจาก 21 ต.ค. 17:45 ถึง 22 ต.ค. 08:08 รอบนี้ไม่พบคำอธิบายเทคนิคที่คุยกันโดยตรงเพิ่มเติมจากหัวข้อ RAG/VRAM ที่รวบรวมไว้แล้ว พบโพสต์ที่คุณแชร์เรื่อง Prompt Cache เวลา 02:49 น. จึงเก็บไว้ในหมวดความรู้จากโพสต์ด้านล่าง ไม่ใช่คำแนะนำที่สมชายตอบ\n\n### ความรู้จากโพสต์: รักษาความต่อเนื่องของโมเดลและวัดการใช้ Cache\n\n**ที่มา:** [แนวทางรักษา Prompt Cache ในระบบ AI Agent — โพสต์ในกลุ่มนักเขียนโปรแกรม](https://www.facebook.com/share/p/1HvoJyLSRM/) — คุณแชร์ 22 ต.ค. 02:49 น.; อ่านจากตัวอย่างโพสต์ที่แสดงใน Messenger\n\nผู้เขียนเสนอให้ใช้โมเดลเดิมต่อเนื่องในงานหนึ่งเซสชัน และเมื่อต้องการให้โมเดลอีกตัวรีวิว ให้ส่งผลลัพธ์ที่สรุปแล้วไปตรวจในอีกห้อง พร้อมเสนอให้รักษาความต่อเนื่องของบัญชีที่ใช้เรียกบริการ\n\n**นำไปใช้:** แนวคิดที่นำไปทดลองได้คือส่งงานสรุปที่ชัดเจนให้ตัวรีวิว และบันทึก cache hit, เวลาก่อนเริ่มตอบ และต้นทุนของงานเดียวกันก่อน–หลังปรับ workflow เพื่อดูผลกับระบบของเรา\n\n**ขอบเขตหลักฐาน:** ตัวเลขประหยัดและความเร็วในโพสต์เป็นรายงานของผู้เขียน ยังไม่ได้ทดสอบกับระบบของคุณ ข้อความว่าเปลี่ยนโมเดลแล้วแคชเดิมถูกลบทันทีทั้งหมด รวมถึงคำอธิบายเรื่องขอบเขตบัญชี ยังไม่ได้ตรวจจากเอกสารผู้ให้บริการ จึงไม่ใช้เป็นกฎสากลหรือข้อสรุปทางเทคนิคในคู่มือนี้\n\n**งานติดตาม:** ถ้าจะใช้แนวคิดนี้ ให้เลือก workflow ตัวอย่างแล้ววัดผลจริง รอบนี้ไม่มี config ใหม่ ไม่มีงานมอบหมายหรือกำหนดส่งที่ยืนยัน และยังไม่ได้ส่งข้อความตอบกลับ\n\nมีไฟล์แนบอื่นในช่วงที่อ่านซึ่งแสดงเพียง URL หรือชื่อไม่สื่อเนื้อหา จึงยังไม่สรุปความรู้ Tech จากรายการเหล่านั้น การตรวจรอบนี้ไม่ได้เติมประวัติช่วงที่ขาดระหว่าง 15–21 ต.ค. ให้ครบ\n\n---\n\n## ความรู้จากบทสนทนาโดยตรง — รวบรวม 21 ตุลาคม 2026\n\nส่วนนี้คัดข้อความที่คุณกับสมชายคุยกัน ไม่ใช่เนื้อหาโพสต์ที่แนบมา ข้อเสนอในหัวข้อ “นำไปใช้” เป็นการเรียบเรียงของผู้ช่วย ไม่ใช่คำพูดหรือคำรับรองของสมชาย\n\n**ขอบเขต:** อ่านตรงรอบนี้เฉพาะบทสนทนา 21 ต.ค. เวลา 11:29–12:43 (วันที่อนุมานจากข้อความวันอังคารก่อนหน้าและวันที่อ่าน) เรื่องเก่าอ้างอิงบันทึกเดิม ไม่ได้ตรวจต้นฉบับซ้ำทุกข้อความ ยังไม่ครบทั้งประวัติเพราะการเชื่อมต่อเบราว์เซอร์หลุด\n\n### 1. แยก chatbot ตามเงื่อนไขออกจากระบบ RAG\n\n**จากแชท 21 ต.ค. 11:29–11:47:** เมื่อคุณถามการใช้ RAM ของบอท “น้องฮูกวิเชียรมาศ” สมชายตอบว่า “if else ตอบคำถามเฉยๆ” ตัวอย่างนี้จึงไม่ใช่หลักฐานว่ามีโมเดลภาษารันอยู่เบื้องหลัง และไม่ควรนำทรัพยากรของบอทนี้ไปแทนประมาณการ RAG โดยตรง\n\n**นำไปใช้:** ก่อนประเมินเครื่อง ให้ระบุว่าบอทตอบตามเงื่อนไข เรียก API หรือรันโมเดลเอง และค้นเอกสารประกอบคำตอบหรือไม่ ยังไม่มีตัวเลข RAM จริงหรือสเปกเครื่องในข้อความที่อ่าน\n\n### 2. ประเมิน RAG ต้องรู้โมเดลก่อน\n\n**จากแชท 21 ต.ค. 11:50–12:11:** คุณถามต่อเรื่อง RAG ใช้ไฟล์ข้อมูลตอบ user สมชายตอบว่า “มันขึ้นอยู่กับโมเดลเลย จะใช้เยอะหรือน้อย” จึงยังสรุป RAM เป็นจำนวน GB ไม่ได้\n\n**นำไปใช้:** ระบุชื่อโมเดลและวิธีรัน แล้วเก็บข้อมูลส่วนค้นเอกสาร จำนวนผู้ใช้พร้อมกัน และผลทดสอบงานจริง คำว่า “เทรนด้วยไฟล์ข้อมูล” ในแชทเป็นคำอธิบายความต้องการ ยังไม่ยืนยันว่ามีการฝึกโมเดลหรือ fine-tune จริง\n\n### 3. “โมเดลเล็ก” ต้องแปลงเป็นสเปกที่ตรวจสอบได้\n\n**จากแชท 21 ต.ค. 12:35–12:43:** เมื่อคุณบอกว่า “น่าจะตัวเล็กสุด” สมชายย้ำว่า “ก็ต้องดูว่าตัวเล็กที่ว่า มันใช้ VRAM เท่าไหร่”\n\n**นำไปใช้:** บันทึกชื่อ/รุ่นโมเดล รูปแบบการรัน สเปก GPU และผลใช้หน่วยความจำจากการทดลองก่อนเลือกเครื่อง ยังไม่มีรุ่นโมเดลสุดท้าย จำนวน GB หรือผลทดสอบยืนยันว่าการ์ดใดพอ\n\n### 4. API ตัวกลางไม่ใช่ Project รวมเอกสาร\n\n**จากบันทึกเดิม 26 ก.ย.:** คุณถามว่า OmniRoute รวมแหล่งข้อมูลเป็น Project เหมือน GPT ได้หรือไม่ สมชายอธิบายว่าเป็น endpoint/API ตัวกลางแทนการเรียกตรง และกล่าวถึงการบีบ Token กับ Cache เพื่อประหยัด\n\n**นำไปใช้:** แยกโจทย์จัดเอกสาร/บริบทออกจากโจทย์จัดทางเรียกโมเดลก่อนเลือกเครื่องมือ นี่เป็นคำอธิบายในบทสนทนา ไม่ใช่การตรวจคุณสมบัติเวอร์ชันปัจจุบัน ไม่มีผลวัดการประหยัดจริง และคำถามปรับหน้าตายังไม่มีคำตอบชัดเจน\n\n### 5. เก็บ workflow จริง ไม่ใช่เพียงรายชื่อเครื่องมือ\n\n**จากบันทึกเดิม 8–9 และ 15 ต.ค.:** สมชายกล่าวถึง Hermes + OmniRoute + Claude/GPT + OpenRouter พร้อมความเห็นเชิงบวกสั้น ๆ เมื่อถามเรื่อง Dots ต่อมาตอบว่าใช้แต่ Claude Code ยังไม่มี config วิธีแบ่งงาน หรือต้นทุนจริงให้ทำเป็นคู่มือติดตั้ง และไม่ควรถือว่าเป็นรีวิว Dots\n\n**ควรถามต่อ:** แต่ละตัวทำหน้าที่อะไร งานไหนส่งให้ตัวไหน มี config ที่ลบ Key แล้วหรือไม่ และงานตัวอย่างมีค่าใช้จ่ายเท่าไร\n\n### หมายเหตุเรื่องราคางานพัฒนา\n\n**จากบันทึกเดิม 26 ก.ย.:** เมื่อถามว่าควรลดราคางาน 30–40% เพราะ AI ช่วยเขียนหรือไม่ สมชายตอบว่า “คิดเต็มเหมือนเดิม” เป็นความคิดเห็น ไม่ใช่ราคาที่ตกลงกับลูกค้า หากคุยต่อควรระบุขอบเขต ผลส่งมอบ และภาระดูแล ไม่ใช้ข้อความนี้แทนใบเสนอราคา\n\n**คำถามค้าง:** จะใช้โมเดลอะไร รันเองหรือ API ผู้ใช้พร้อมกันเท่าไร และใช้ VRAM จริงเท่าไร? ต้องการ Project รวมเอกสารหรือ API ตัวกลาง? ยังไม่ได้ส่งคำถามเหล่านี้ และไม่มีวันส่งงานที่ยืนยัน\n\n---\n\nอัปเดต 15 ตุลาคม 2026 · ช่วงที่อ่านต่อเนื่อง: 21 ก.ย. เวลา 19:59 – 15 ต.ค. เวลา 20:28 · คัดเฉพาะ AI จากข้อความและตัวอย่างโพสต์ ไม่ได้ถอดภาพ/วิดีโอทุกชิ้น\n\n## อัปเดตใหม่ 6–15 ตุลาคม 2026\n\n### ประเด็นสำคัญ\n\n- **สิ่งที่สมชายบอกเอง:** 8–9 ต.ค. กล่าวถึงชุด Hermes + OmniRoute + Claude/GPT + OpenRouter และให้ความเห็นเชิงบวกสั้น ๆ วันที่ 15 ต.ค. เมื่อถามเรื่อง Dots ตอบว่าใช้แต่ Claude Code ยังไม่มีรีวิว Dots หรือข้อมูลต้นทุนที่วัดจริง\n- **คุม Agent หลายตัว:** OpenRig จัดทีมผ่าน YAML/tmux; Zeron รวม Agent และรันบน VPS; Herdr รวม Terminal/สถานะและเครื่องผ่าน SSH เป็นความสามารถตามโพสต์ ยังไม่ได้ลองหรือเพิ่มสิทธิ์ให้เครื่องใด\n- **คุมต้นทุนและ Context:** Three-Tier Agent แยกวางแผน/ลงมือ/คัดข้อมูล, Handoff ตาม Milestone, อ่านเฉพาะจุด และเก็บ Log ยาวนอกแชท; vibereceipt ประเมินมูลค่าจาก Log ตามราคา API ไม่ใช่บิลจริง ส่วนตัวเลขส่วนลด/เครดิตจากโพสต์ต้องตรวจผู้ให้บริการก่อน\n- **Skills / MCP / REA:** แนวทางเขียน Skill, CLAUDE.md, Postgres MCP และ REA วิเคราะห์ซอฟต์แวร์โดยมีหลักฐานและ SPEC ก่อนพัฒนาต่อ ใช้เฉพาะระบบที่มีสิทธิ์ตรวจสอบ\n- **Local AI และสื่อ:** Embedding สำหรับ RAG, โมเดล Saluki, VoiceStudio, Blender และ Excalidraw CLI รวมถึงตัวอย่างทำฐานข้อมูล/แดชบอร์ดและเว็บ 3D\n- **Agent สำหรับงานจริง:** AIHOT คัดข่าว, TinyFish กับ Hermes อ่าน/โต้ตอบเว็บ, Managed Agents, Zero-to-Launch Workflow และ AI รับโทรศัพท์ ข่าวและความสามารถเหล่านี้สรุปตามผู้แชร์ ไม่ได้ยืนยันสเปก ราคา หรือวันเปิดให้ใช้เป็นข้อเท็จจริงอิสระ\n\n### งานค้าง กำหนดเวลา และข้อความที่ควรตอบ\n\n- ขอ workflow/config ของ Hermes + OmniRoute แบบตัด Key/ข้อมูลลับ พร้อมงานตัวอย่างและต้นทุนจริง เพื่อเทียบกับ Claude Code ก่อนตัดสินใจทดลอง\n- ถ้าจะใช้ Agent หลายเครื่อง ต้องทบทวนสิทธิ์ไฟล์/Repository และข้อมูลที่จะส่งออก ไม่ใช้คำว่า Local เป็นหลักประกันว่าไม่ส่งข้อมูล\n- ไ o / ความสามารถปลายทางทั้งหมด\n\n> สรุปจากข้อความและตัวอย่างโพสต์ที่ Messenger แสดง ไม่ใช่ประวัติทั้งหมดของแชท ยังไม่ได้อ่านเนื้อหาในภาพ วิดีโอ หรือโพสต์ปลายทางครบทุกชิ้น ตัวเลข ราคา และความสามารถที่กล่าวถึงเป็นข้อมูลในโพสต์ที่แชร์ ไม่ใช่ผลตรวจสอบอิสระ ตัดเรื่องส่วนตัวและข้อมูลเข้าสู่ระบบออกแล้ว\n\n## ประเด็นสำคัญ\n\n### 1. OmniRoute: ตัวกลาง API ไม่ใช่พื้นที่ Project\n\nวันที่ 26 ก.ย. คุณถามว่า OmniRoute สร้าง Project เพื่อรวมแหล่งข้อมูลเรื่องเดียวกันเหมือน GPT ได้หรือไม่ สมชายอธิบายว่าเป็น endpoint API ตัวกลางแทนการเรียกตรง และกล่าวถึงการบีบ Token กับ Cache เพื่อประหยัด พร้อมส่ง GitHub และระบุว่าเป็นโอเพนซอร์ส ส่วนคำถามเรื่องปรับหน้าตายังไม่พบคำตอบชัดเจนในช่วงที่อ่าน\n\n### 2. AI ช่วยเขียนระบบกับการคิดราคา\n\nวันที่ 26 ก.ย. คุณถามว่าควรลดราคางานระบบใหญ่ที่ AI ช่วยเขียนลง 30–40% หรือไม่ สมชายตอบว่า “คิดเต็มเหมือนเดิม” นี่เป็นความคิดเห็นในแชท ไม่ใช่ราคาที่ตกลงกับลูกค้า ยังไม่พบขอบเขตงานหรือใบเสนอราคาที่สรุปแล้ว\n\n### 3. MCP และคลังความรู้\n\n- OmniGet MCP + Notion: โพสต์เล่าการดึงเนื้อหาจากลิงก์ สรุป แปล และเก็บพร้อมแหล่งอ้างอิงลง Notion โดยกล่าวถึงรุ่นดัดแปลงของผู้โพสต์ ไม่ควรถือว่ารุ่นทางการมีความสามารถเหมือนกันทั้งหมด\n- Claude Code + NotebookLM ผ่าน MCP: มีคลิปสอนเชื่อมต่อ คำกล่าวว่าไม่ใช้ Token เป็นคำกล่าวในโพสต์ ยังไม่ได้ตรวจสอบเงื่อนไข\n- Azure Agent Skills: โพสต์เสนอการเพิ่มความรู้เฉพาะด้าน Azure ให้ AI coding assistants ด้วย Skills และชุดความรู้ตามบทบาท\n- Codex + Blender ผ่าน MCP: แชร์บทความทดลองสร้างหุ่นยนต์ บ้านขนาดเล็ก และนาฬิกา ตั้งแต่ Prompt จนถึงภาพเรนเดอร์\n- มีโพสต์แนะนำ Jev และโพสต์จากกลุ่ม Claude Cowork แต่ตัวอย่างบางชิ้นแสดงเนื้อหาไม่ครบ\n\n### 4. ใช้ AI ตรวจงานและอ่านเอกสาร\n\n- Code Review ก่อนส่ง Pull Request: โพสต์แนะนำให้ AI ตรวจชื่อ โค้ดซ้ำ และเงื่อนไขซับซ้อน โดยคงพฤติกรรมเดิม จากนั้นให้คนตรวจและรัน Test อีกครั้ง\n- PDF / Excel / PowerPoint: แชร์ปัญหา AI อ่านตารางคลาดเคลื่อนหรือหัวข้อหาย ตัวอย่างข้อความยังไม่แสดงวิธีแก้ครบ\n- มีโพสต์เรื่องใช้ Codex CLI ผ่าน MCP สำหรับรีวิวโปรเจกต์และงานโค้ดยาก เป็นแนวทางจากผู้โพสต์ ไม่ใช่การตั้งค่าที่ได้ดำเนินการให้แล้ว\n\n### 5. โมเดล ต้นทุน และการรันในเครื่อง\n\n- Bonsai / Qwen 27B: โพสต์ล่าสุดกล่าวถึงการลดหน่วยความจำและข้อแตกต่างระหว่างงานสั้นกับงานยาว ต้องทดสอบกับงานจริงก่อนสรุปความเหมาะสม\n- DeepSeek-V4.1-Flash: โพสต์เน้นบริบทยาวและ KV Cache พร้อมเตือนว่าตัวโมเดลไม่ใช่รุ่นเบาสำหรับโน้ตบุ๊กทั่วไป\n- Claude Opus 5.5: แชร์ข่าวต้นทุนและผล Code Arena โดยโพสต์เองเตือนว่าคะแนนความชอบงานเว็บไม่เท่ากับความถูกต้องของโค้ดทุกประเภท\n- Experiential: โพสต์แนะนำ gateway รวมโมเดลผ่าน API เดียว\n- Local LLM สำหรับสร้างภาพ: ตัวอย่างแสดงเพียงคำแนะนำกว้าง ๆ ยังไม่ทราบชื่อรุ่นและเงื่อนไขใช้งานครบ\n- AI Sideh0e: ต้นทางระบุชัดว่าเป็นคอนเซปต์ล้อเล่น ไม่ใช่แอปจริง จึงไม่จัดเป็นเครื่องมือพร้อมใช้\n\n## งานและเรื่องที่ควรติดตาม\n\n- จากแชท: ยืนยันว่าเป้าหมายคือทำ Project รวมเอกสาร หรือทำตัวกลางเรียกโมเดล เพราะเป็นคนละความต้องการ\n- จากแชท: คำถามเรื่องปรับหน้าตา OmniRoute ยังไม่พบคำตอบชัดเจน\n- ข้อเสนอแนะเพิ่มเติม: หากจะคุยราคางานต่อ ให้รวบรวมขอบเขตงาน ผลส่งมอบ การรับประกัน และค่าดูแลก่อน ยังไม่มีราคาอนุมัติในแชท\n- ข้อเสนอแนะเพิ่มเติม: ทดลองกระบวนการลิงก์ → สรุป → คลังความรู้ด้วยข้อมูลที่ไม่ลับ และตรวจความครบถ้วนก่อนใช้จริง\n- กำหนดเวลา: ไม่พบวันส่งงานหรือนัดหมายที่ผูกกับประเด็น AI ในช่วงที่อ่าน\n\n## ข้อความที่อาจตอบต่อ — ยังไม่ได้ส่ง\n\n> เรื่อง OmniRoute เข้าใจว่าเป็นตัวกลาง API ถ้าจะทำ Project รวมเอกสารกับปรับหน้าเว็บของเรา ต้องมีส่วนไหนเพิ่มบ้าง?\n\n> เรื่องราคางาน เดี๋ยวขอแยกขอบเขตงาน ส่งมอบ และดูแลหลังส่งก่อน แล้วค่อยคุยราคากันอีกที\n\n## ลิงก์พร้อมหัวข้อ\n\n1. [OmniRoute — GitHub ที่สมชายส่งให้](https://github.com/diegosouzapw/OmniRoute) — 26 ก.ย.\n2. [OmniGet MCP + Notion — เปลี่ยนลิงก์โซเชียลเป็นคลังความรู้](https://www.facebook.com/share/p/19KPVPYzcF/) — 26 ก.ย.\n3. [Claude Code + NotebookLM ผ่าน MCP — คลิปจาก alex](https://x.com/alextalksai/status/2102137225014096217?s=49&t=FKd8BqJlgcwaM01wtOglVw) — 22 ก.ย.\n4. [Azure Agent Skills — ความรู้ Azure สำหรับ AI coding assistants](https://www.facebook.com/share/p/1FP6RsZZx4/?mibextid=wwXIfr) — 25 ก.ย.\n5. [Codex + Blender ผ่าน MCP —
